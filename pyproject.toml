[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tasksmith"
version = "0.8.1"
description = "A coordinator that moves work forward when humans and AI agents are nodes in the same task DAG"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "ghdag>=0.152.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tasksmith"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/tasksmith/reconcile.py" = ["E501"]
"src/tasksmith/tick.py" = ["E501"]
"src/tasksmith/transition.py" = ["E501"]
"src/tasksmith/human.py" = ["E501"]
"src/tasksmith/cli.py" = ["E501"]